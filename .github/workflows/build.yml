name: Build Windows 11 26H1 ISO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 执行 UUP 下载与原生 DISM 压制
        shell: cmd
        run: |
          call uup_download_windows.cmd

      - name: 分卷切片 (绕过 GitHub 2GB 单文件限制)
        shell: pwsh
        run: |
          $iso = Get-ChildItem -Filter *.iso | Select-Object -First 1
          if (-not $iso) {
            Write-Error "ISO 文件未生成！"
            exit 1
          }
          Write-Host "找到生成文件: $($iso.FullName) (大小: $([math]::Round($iso.Length/1GB, 2)) GB)"
          
          # 使用 Runner 自带的 split 工具进行二进制切片
          $splitBin = "C:\Program Files\Git\usr\bin\split.exe"
          & $splitBin -b 1800M $iso.FullName "$($iso.Name).part_"
          Get-ChildItem *.part_*

      - name: 发布切片至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win11-26h1-28000.2704
          name: "Windows 11 26H1 (Build 28000.2704) Pro ISO"
          files: "*.part_*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
