name: Build Windows ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'uup_download_linux.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 深度清理磁盘空间 (释放 30GB+)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 安装压制依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 cabextract wimtools chntpw genisoimage

      - name: 执行 UUP 转制与 ISO 生成
        run: |
          chmod +x uup_download_linux.sh
          ./uup_download_linux.sh

      - name: 分卷切片 (绕过 GitHub 2GB 限制)
        run: |
          ISO_FILE=$(ls *.iso | head -n 1)
          echo "Generated ISO: $ISO_FILE"
          split -b 1800M "$ISO_FILE" "${ISO_FILE}.part_"

      - name: 上传 ISO 分卷至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win11-26h1-release
          name: "Windows 11 26H1 ISO Build"
          files: "*.part_*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
